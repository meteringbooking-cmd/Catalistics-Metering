<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Notices</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app" hidden>
<main class="page">
  <div class="page-head"><div><h1>Portal Notices</h1><p>Notices appear on engineers' portals between the dates you choose. Send to everyone, one team, or one engineer.</p></div></div>
  <div id="book"></div>
</main>
</div>
<script type="module">
import { initPage, C, $, esc, toast, todayISO, addDays, addMonths, daysBetween, num, fmtNum, fmtPct, fmtDate, fmtMoney, groupBy, teamOf, rag, fetchRange, codeOf } from './assets/app.js';
import { logbook, engineerFields } from './assets/logbook.js';

const ctx = await initPage(); const { cfg } = ctx;
await logbook($('#book'), {
  collection: C.notifications, dateField: 'publishDate', defaultDays: 90, futureDays: 90, addLabel: 'New notice', sheetName: 'Notices',
  fields: [
    { key: 'title', label: 'Title', type: 'text', required: true, full: true },
    { key: 'message', label: 'Message', type: 'textarea', required: true },
    { key: 'audience', label: 'Send to', type: 'select', options: ['Everyone', 'Team', 'Engineer'], default: 'Everyone', required: true, filter: true },
    { key: 'teamId', label: 'Team (if sending to a team)', type: 'team' },
    { key: 'engineerId', label: 'Engineer (if sending to one person)', type: 'engineer' },
    { key: 'priority', label: 'Priority', type: 'select', options: ['Normal', 'Important'], default: 'Normal', filter: true, format: v => v === 'Important' ? '<span class="badge bad">Important</span>' : '<span class="badge">Normal</span>' },
    { key: 'publishDate', label: 'Show from', type: 'date', required: true, default: () => todayISO() },
    { key: 'expiryDate', label: 'Show until', type: 'date', default: () => addDays(todayISO(), 30) },
  ],
  beforeSave: d => {
    if (d.audience === 'Team' && !d.teamId) { toast('Choose the team.', 'warn'); return false; }
    if (d.audience === 'Engineer' && !d.engineerId) { toast('Choose the engineer.', 'warn'); return false; }
    if (d.audience !== 'Engineer') Object.assign(d, { engineerId: '', engineerName: '' });
    if (d.audience === 'Engineer') d.teamId = '';
    if (d.audience === 'Everyone') d.teamId = '';
    return d;
  },
  rowClass: r => r.expiryDate && r.expiryDate < todayISO() ? 'cell-muted' : '',
}, ctx);
</script>
</body>
</html>
