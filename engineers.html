<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineers</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app" hidden>
<main class="page">
  <div class="page-head"><div><h1>Engineers</h1><p>The engineer directory. Every other page takes names, teams and contracts from here. Mark people as <b>Leaver</b> rather than deleting them so their history stays intact.</p></div></div>
  <div id="book"></div>
</main>
</div>
<script type="module">
import { initPage, C, $, esc, state, teamOf, contractName, groupBy } from './assets/app.js';
import { logbook } from './assets/logbook.js';

const ctx = await initPage(); const { cfg } = ctx;
await logbook($('#book'), {
  collection: C.engineers, addLabel: 'Add engineer', sheetName: 'Engineers', sortKey: 'name', sortAsc: true, deleteRoles: ['admin'],
  fields: [
    { key: 'name', label: 'Name', type: 'text', required: true },
    { key: 'employeeNumber', label: 'Employee number', type: 'text' },
    { key: 'teamId', label: 'Team', type: 'team', required: true },
    { key: 'contractId', label: 'Contract', type: 'contract', help: 'Taken from the team if left blank.' },
    { key: 'level', label: 'Level', type: 'select', options: c => c.lists.engineerLevels, filter: true },
    { key: 'employmentType', label: 'Employment', type: 'select', options: c => c.lists.employmentTypes, filter: true },
    { key: 'status', label: 'Status', type: 'select', options: ['Active', 'Leaver'], default: 'Active', filter: true,
      format: v => `<span class="badge ${v === 'Leaver' ? '' : 'good'}">${esc(v || 'Active')}</span>` },
    { key: 'startDate', label: 'Start date', type: 'date' },
    { key: 'leaveDate', label: 'Leave date', type: 'date', list: false },
    { key: 'email', label: 'Email', type: 'email', list: false },
    { key: 'phone', label: 'Phone', type: 'text', list: false },
    { key: 'vehicleReg', label: 'Vehicle registration', type: 'text' },
    { key: 'basePostcode', label: 'Home / base postcode', type: 'text', list: false },
  ],
  beforeSave: d => {
    if (!d.contractId && d.teamId) d.contractId = teamOf(d.teamId)?.contractId || '';
    d.vehicleReg = (d.vehicleReg || '').toUpperCase(); d.status = d.status || 'Active';
    state.engineers = null;
    return d;
  },
  rowClass: r => r.status === 'Leaver' ? 'cell-muted' : '',
  summary: (rows, el, ctx2, all) => {
    const active = all.filter(r => (r.status || 'Active') === 'Active');
    const byTeam = groupBy(active, r => r.teamId || '');
    el.innerHTML = `<div class="grid" style="--min:160px;margin-bottom:14px"><div class="kpi"><div class="label">Active engineers</div><div class="value">${active.length}</div><div class="sub">${all.length - active.length} leavers on file</div></div>
      ${cfg.teams.map(t => `<div class="kpi"><div class="label">${esc(t.name)}</div><div class="value">${(byTeam.get(t.id) || []).length}</div><div class="sub">${esc(t.leader)} · ${esc(contractName(t.contractId))}</div></div>`).join('')}</div>`;
  },
}, ctx);
</script>
</body>
</html>
