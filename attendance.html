<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .codes { display: flex; gap: 4px; flex-wrap: wrap; }
  .codes button { all: unset; cursor: pointer; min-width: 30px; text-align: center; padding: 4px 6px; border-radius: 6px; font-weight: 700; font-size: 12px; border: 1px solid var(--line-2); color: var(--muted); }
  .codes button:hover { border-color: var(--accent); }
  .codes button.on { color: #081325; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .matrix .we { background: rgba(0,0,0,.18); }
</style>
</head>
<body>
<div id="app" hidden>
<main class="page">
  <div class="page-head"><div><h1>Attendance</h1><p>One code per engineer per day. Codes and what they count as are set on <a href="data-input.html?tab=attendance">Targets &amp; KPIs</a>.</p></div></div>
  <div class="tabs"><button class="on" data-t="day" type="button">Day</button><button data-t="month" type="button">Month calendar</button></div>
  <section id="dayView">
    <div class="toolbar">
      <label class="field">Date<input type="date" id="day"></label>
      <label class="field">Team<span id="tWrap"></span></label>
      <button class="btn" id="copyPrev" type="button">Copy previous working day</button>
      <button class="btn" id="fillBlank" type="button">Fill blanks with “working”</button>
      <div class="spacer"></div><button class="btn primary" id="save" type="button">Save attendance</button>
    </div>
    <div class="legend" id="legend" style="margin-bottom:12px"></div>
    <div class="table-wrap" style="--max-h:70vh"><table class="table" id="dayTbl"></table></div>
  </section>
  <section id="monthView" hidden>
    <div class="toolbar">
      <label class="field">Month<input type="month" id="month"></label>
      <label class="field">Team<span id="tWrap2"></span></label>
      <span class="help">Click a day to change its code.</span>
      <div class="spacer"></div><button class="btn" id="exportMonth" type="button">⬇ Export</button>
    </div>
    <div class="table-wrap" style="--max-h:72vh"><table class="table matrix" id="monthTbl"></table></div>
  </section>
</main>
</div>
<script type="module">
import { initPage, C, db, doc, $, $$, esc, el, options, fetchRange, getEngineers, prevWorkingDay, todayISO, addDays, isWorkingDay, monthStart, monthEnd,
  stamp, commitInBatches, setDoc, deleteDoc, toast, modal, teamSelect, teamOf, codeOf, codeChip, attendanceSummary, fmtPct, rag, exportXlsx, parseISO } from './assets/app.js';

const ctx = await initPage(); const { cfg } = ctx;
const codes = cfg.attendanceCodes;
const defaultWorking = codes.find(c => c.type === 'working')?.code || codes[0]?.code;
$('#tWrap').innerHTML = teamSelect('team'); $('#tWrap2').innerHTML = teamSelect('team2');
$('#day').value = todayISO(); $('#month').value = todayISO().slice(0, 7);
$('#legend').innerHTML = codes.map(c => `<span>${codeChip(c.code)} ${esc(c.label)}</span>`).join('');
let engineers = await getEngineers(), saved = new Map(), picks = new Map();

$$('.tabs button').forEach(b => b.onclick = () => {
  $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#dayView').hidden = b.dataset.t !== 'day'; $('#monthView').hidden = b.dataset.t !== 'month';
  if (b.dataset.t === 'month') loadMonth();
});

/* ---------- Day ---------- */
async function loadDay() {
  const rows = await fetchRange(C.attendance, $('#day').value, $('#day').value);
  saved = new Map(rows.map(r => [r.engineerId, r.code])); picks = new Map(saved); drawDay();
}
function drawDay() {
  const tid = $('#team').value;
  const list = engineers.filter(e => !tid || e.teamId === tid);
  const teams = [...new Set(list.map(e => e.teamId || ''))].sort((a, b) => (teamOf(a)?.name || 'zz').localeCompare(teamOf(b)?.name || 'zz', 'en', { numeric: true }));
  let html = '<thead><tr><th>Engineer</th><th>Code</th></tr></thead><tbody>';
  for (const t of teams) {
    html += `<tr class="group-row"><td colspan="2">${esc(teamOf(t) ? `${teamOf(t).name} — ${teamOf(t).leader}` : 'No team')}</td></tr>`;
    for (const e of list.filter(x => (x.teamId || '') === t)) {
      const cur = picks.get(e.id);
      html += `<tr data-id="${esc(e.id)}"><td>${esc(e.name)}</td><td><div class="codes">${codes.map(c => `<button type="button" data-c="${esc(c.code)}" title="${esc(c.label)}" class="${cur === c.code ? 'on' : ''}" style="${cur === c.code ? `background:${c.colour};border-color:${c.colour}` : ''}">${esc(c.code)}</button>`).join('')}</div></td></tr>`;
    }
  }
  $('#dayTbl').innerHTML = html + '</tbody>';
  $$('#dayTbl .codes button').forEach(b => b.onclick = () => {
    const id = b.closest('tr').dataset.id;
    picks.set(id, picks.get(id) === b.dataset.c ? '' : b.dataset.c); drawDay();
  });
  const s = attendanceSummary([...picks.values()].filter(Boolean).map(code => ({ code })), cfg);
  ctx.summary = s;
}
$('#day').onchange = loadDay; $('#team').onchange = drawDay;
$('#fillBlank').onclick = () => { const tid = $('#team').value; engineers.filter(e => !tid || e.teamId === tid).forEach(e => { if (!picks.get(e.id)) picks.set(e.id, defaultWorking); }); drawDay(); };
$('#copyPrev').onclick = async () => {
  const p = prevWorkingDay($('#day').value);
  const rows = await fetchRange(C.attendance, p, p);
  rows.forEach(r => picks.set(r.engineerId, r.code)); drawDay(); toast(`Copied ${rows.length} code(s) from ${p}`);
};
$('#save').onclick = async () => {
  const day = $('#day').value, ops = [];
  for (const e of engineers) {
    const now = picks.get(e.id) || '', was = saved.get(e.id) || '';
    if (now === was) continue;
    const ref = doc(db, C.attendance, `${day}_${e.id}`);
    ops.push(now ? { type: 'set', ref, data: stamp({ date: day, engineerId: e.id, engineerName: e.name, teamId: e.teamId || '', contractId: e.contractId || '', code: now }) } : { type: 'delete', ref });
  }
  if (!ops.length) { toast('Nothing has changed'); return; }
  await commitInBatches(ops); toast(`Saved ${ops.length} change(s)`, 'good'); loadDay();
};

/* ---------- Month ---------- */
let monthRows = [];
async function loadMonth() {
  const m = $('#month').value + '-01';
  monthRows = await fetchRange(C.attendance, monthStart(m), monthEnd(m)); drawMonth();
}
function drawMonth() {
  const m = $('#month').value + '-01', tid = $('#team2').value;
  const days = []; for (let d = monthStart(m); d <= monthEnd(m); d = addDays(d, 1)) days.push(d);
  const list = engineers.filter(e => !tid || e.teamId === tid);
  const map = new Map(monthRows.map(r => [`${r.date}_${r.engineerId}`, r.code]));
  let html = `<thead><tr><th>Engineer</th>${days.map(d => `<th class="${isWorkingDay(d) ? '' : 'we'}">${parseISO(d).getDate()}<div style="font-size:10px">${'SMTWTFS'[parseISO(d).getDay()]}</div></th>`).join('')}<th>Attendance</th></tr></thead><tbody>`;
  for (const e of list) {
    const mine = monthRows.filter(r => r.engineerId === e.id);
    const s = attendanceSummary(mine, cfg);
    html += `<tr><td>${esc(e.name)}</td>${days.map(d => `<td class="clickable ${isWorkingDay(d) ? '' : 'we'}" data-e="${esc(e.id)}" data-d="${d}">${codeChip(map.get(`${d}_${e.id}`))}</td>`).join('')}
      <td class="cell-${rag(s.attendancePct, cfg.targets.attendanceTarget)}">${fmtPct(s.attendancePct, 0)}</td></tr>`;
  }
  $('#monthTbl').innerHTML = html + '</tbody>';
  $$('#monthTbl td.clickable').forEach(td => td.onclick = () => {
    const e = engineers.find(x => x.id === td.dataset.e), d = td.dataset.d, cur = map.get(`${d}_${e.id}`) || '';
    const body = el(`<label class="field">${esc(e.name)} · ${d}<select>${options(codes.map(c => ({ value: c.code, label: `${c.code} — ${c.label}` })), cur, { blank: '(no code)' })}</select></label>`);
    modal({ title: 'Change attendance', body, actions: [{ label: 'Cancel', kind: 'ghost' }, { label: 'Save', kind: 'primary', onClick: async () => {
      const v = $('select', body).value, ref = doc(db, C.attendance, `${d}_${e.id}`);
      if (v) await setDoc(ref, stamp({ date: d, engineerId: e.id, engineerName: e.name, teamId: e.teamId || '', contractId: e.contractId || '', code: v }));
      else await deleteDoc(ref);
      toast('Saved', 'good'); loadMonth();
    } }] });
  });
}
$('#month').onchange = loadMonth; $('#team2').onchange = drawMonth;
$('#exportMonth').onclick = () => {
  const m = $('#month').value + '-01'; const days = []; for (let d = monthStart(m); d <= monthEnd(m); d = addDays(d, 1)) days.push(d);
  const map = new Map(monthRows.map(r => [`${r.date}_${r.engineerId}`, r.code]));
  exportXlsx(`attendance-${$('#month').value}`, { Attendance: engineers.map(e => Object.fromEntries([['Engineer', e.name], ['Team', teamOf(e.teamId)?.name || ''], ...days.map(d => [d, map.get(`${d}_${e.id}`) || ''])])) });
};
loadDay();
</script>
</body>
</html>
