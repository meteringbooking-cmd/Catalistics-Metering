<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Catalistics</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
  .login { width: min(420px, 100%); }
  .login .logo { display: block; width: 260px; max-width: 80%; margin: 0 auto 26px; }
  .login .card { padding: 26px; }
  .login form { display: grid; gap: 14px; }
  .login .err { color: var(--bad); min-height: 20px; font-size: 13px; }
  .login .foot { text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--faint); }
</style>
</head>
<body>
<div class="login">
  <img class="logo" src="assets/logo-dark.png" alt="Catalistics">
  <div class="card">
    <h2 style="margin-bottom:4px">Sign in</h2>
    <p class="muted" id="clientLine">Use the email and password your administrator gave you.</p>
    <form id="form">
      <label class="field">Email<input type="email" id="email" autocomplete="username" required></label>
      <label class="field">Password<input type="password" id="password" autocomplete="current-password" required></label>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit" id="go">Sign in</button>
      <button class="btn ghost sm" type="button" id="forgot">Forgot password?</button>
    </form>
  </div>
  <div class="foot">Catalistics · field performance platform<br><a href="setup.html">First-time setup</a></div>
</div>
<script type="module">
import { auth, C, fetchDoc } from './assets/app.js';
import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const next = new URLSearchParams(location.search).get('next');
const $ = id => document.getElementById(id);

async function route(user) {
  let role = 'manager';
  try { role = (await fetchDoc(C.users, user.uid))?.role || 'manager'; } catch (e) { /* fall through */ }
  if (role === 'engineer') location.href = 'portal.html';
  else location.href = next && !next.startsWith('http') ? next : 'index.html';
}

const off = onAuthStateChanged(auth, u => { off(); if (u) route(u); });

$('form').onsubmit = async e => {
  e.preventDefault();
  $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Checking…';
  try {
    const cred = await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
    await route(cred.user);
  } catch (err) {
    const code = err.code || '';
    $('err').textContent = /invalid|wrong-password|user-not-found/.test(code) ? 'Email or password not recognised.'
      : code.includes('too-many') ? 'Too many attempts. Wait a moment and try again.' : (err.message || 'Could not sign in.');
    $('go').disabled = false; $('go').textContent = 'Sign in';
  }
};
$('forgot').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) { $('err').textContent = 'Type your email above first.'; return; }
  try { await sendPasswordResetEmail(auth, email); $('err').style.color = 'var(--good)'; $('err').textContent = 'If that email has an account, a reset link is on its way.'; }
  catch (e) { $('err').textContent = e.message; }
};
</script>
</body>
</html>
